[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-merge-system"
version = "3.7.1"
description = "教育計画PDFマージシステム - 各種ドキュメントをPDFに変換・マージするWindowsアプリケーション"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "School Tools"},
]
keywords = ["pdf", "merge", "convert", "education", "japanese", "ichitaro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "pywin32>=306",
    "pypdf>=4.0.0",
    "pymupdf>=1.23.0",
    "reportlab>=4.0.0",
    "Pillow>=10.0.0",
    "pywinauto>=0.6.8",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-timeout>=2.2.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "bandit[toml]>=1.7.5",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/atariryuma/education-pdf-merger"
Documentation = "https://github.com/atariryuma/education-pdf-merger/blob/main/README.md"
Repository = "https://github.com/atariryuma/education-pdf-merger"
Changelog = "https://github.com/atariryuma/education-pdf-merger/blob/main/CHANGELOG.md"

[project.scripts]
pdf-merge = "run_app:main"

[tool.setuptools]
packages = ["shared", "core", "infrastructure", "converters", "gui"]
