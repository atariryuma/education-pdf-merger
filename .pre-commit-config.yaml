# pre-commit設定ファイル
# インストール: pip install pre-commit && pre-commit install
# 手動実行: pre-commit run --all-files

repos:
  # === 基本的なファイルチェック ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  # === Windows予約名ファイル検出（nul, con, prn 等の誤作成を防ぐ） ===
  - repo: local
    hooks:
      - id: no-windows-reserved-files
        name: Windows予約名ファイルの検出
        description: nul, con, prn 等のWindows予約名ファイルがコミットされるのを防ぐ
        entry: python scripts/check_no_windows_reserved.py
        language: system
        pass_filenames: false
        always_run: true

  # === Ruff: リンター・フォーマッター ===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # === mypy: 型チェック ===
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        args: [--config-file=mypy.ini, --no-error-summary]
        additional_dependencies: [types-Pillow]
        files: ^(core|shared|infrastructure|converters)/.*\.py$

  # === Bandit: セキュリティチェック ===
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [--skip, B101, --skip, B601, --exit-zero]
        exclude: ^tests/

default_install_hook_types: [pre-commit]
fail_fast: false
