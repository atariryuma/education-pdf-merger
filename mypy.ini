[mypy]
# mypy configuration for PDF Merge System
# Strict type checking enabled

# === Basic Settings ===
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
# Gradual adoption - recommend setting to True in future
disallow_untyped_defs = False
disallow_any_unimported = False

# === Type Check Strictness ===
# None handling
no_implicit_optional = True
strict_optional = True

# Error detection
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# === Third-party Libraries ===
# Ignore libraries without type stubs
ignore_missing_imports = True

# === Exclusions ===
exclude = (?x)(
    ^venv/
    | ^build/
    | ^dist/
    | ^installer/
    | \.pyc$
  )

# === Per-Module Settings ===

# Core processing modules (strict)
[mypy-core.pdf_merge_orchestrator]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.document_collector]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.pdf_converter]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-core.pdf_processor]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Exceptions and constants (strict)
[mypy-shared.exceptions]
disallow_untyped_defs = True

[mypy-shared.constants]
disallow_untyped_defs = True

# Security related (strict)
[mypy-infrastructure.path_validator]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-infrastructure.logging_config]
disallow_untyped_defs = True
warn_unused_ignores = False

# infrastructure: ghostscript (到達不能コードの警告を無効化)
[mypy-infrastructure.ghostscript]
warn_unreachable = False

# GUI layer (relaxed - tkinter type definitions are incomplete)
[mypy-gui.*]
disallow_untyped_defs = False
warn_return_any = False
ignore_errors = True

# COM integration (relaxed - win32com has no type definitions)
[mypy-converters.office_converter]
disallow_untyped_defs = False
warn_return_any = False

[mypy-converters.ichitaro_converter]
disallow_untyped_defs = False
warn_return_any = False

# Tests (relaxed)
[mypy-tests.*]
disallow_untyped_defs = False
warn_unreachable = False
